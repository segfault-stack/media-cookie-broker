# Example only: replace broker.example.com and certificate paths for your deployment.
limit_req_zone $binary_remote_addr zone=cookie_broker_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name broker.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name broker.example.com;
    ssl_certificate /etc/letsencrypt/live/broker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/broker.example.com/privkey.pem;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        limit_req zone=cookie_broker_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

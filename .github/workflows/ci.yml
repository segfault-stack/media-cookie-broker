name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          test -z "$unformatted" || {
            printf 'Run gofmt on:\n%s\n' "$unformatted" >&2
            exit 1
          }
      - name: Run tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...

  extension-and-shell:
    name: Extension and shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check shell syntax
        run: bash -n mcb install*.sh scripts/*.sh tests/*.sh
      - name: Run extension tests
        run: npm --prefix extension test
      - name: Check extension JavaScript syntax
        run: find extension -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run operator helper tests
        run: tests/mcb-test.sh
      - name: Run server installer tests
        run: tests/install-test.sh
      - name: Run extension installer tests
        run: tests/install-extension-test.sh
      - name: Run cookie-sync installer tests
        run: tests/install-cookie-sync-test.sh
      - name: Run extension packaging tests
        run: tests/package-extension-test.sh
      - name: Run onboarding documentation tests
        run: tests/onboarding-docs-test.sh

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build broker image
        run: docker build --target broker -t media-cookie-broker:preview .
      - name: Build cookie-sync image
        run: docker build --target cookie-sync -t media-cookie-broker-cookie-sync:preview .
      - name: Run container smoke tests
        env:
          COOKIE_BROKER_TEST_IMAGE: media-cookie-broker:preview
          COOKIE_SYNC_TEST_IMAGE: media-cookie-broker-cookie-sync:preview
        run: tests/container-smoke.sh
      - name: Run cookie-sync installer integration
        env:
          COOKIE_BROKER_TEST_IMAGE: media-cookie-broker:preview
          COOKIE_SYNC_INSTALL_TEST_IMAGE: media-cookie-broker-cookie-sync:preview
        run: tests/install-cookie-sync-integration.sh
